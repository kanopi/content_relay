content_relay.settings:
  type: config_object
  label: 'Content Relay settings'
  mapping:
    site_id:
      type: string
      label: 'Site ID'
      # Generated at install. Peers address messages to this value, so it
      # identifies the site across environments and must survive config sync.
    site_label:
      type: label
      label: 'Site label'
    signature:
      type: mapping
      label: 'Signature verification'
      mapping:
        clock_window:
          type: integer
          label: 'Accepted clock difference, in seconds'
    users:
      type: mapping
      label: 'Users'
      mapping:
        sync_roles:
          type: boolean
          label: 'Sync user roles'
    encryption:
      type: mapping
      label: 'Encryption'
      mapping:
        require:
          type: boolean
          label: 'Refuse unencrypted messages from every peer'
        transition_window:
          type: integer
          label: 'Seconds after an encryption mode change during which messages in the previous mode are still accepted'
    files:
      type: mapping
      label: 'Files'
      mapping:
        own_domains:
          type: sequence
          label: 'Other domains this site is reached at; absolute links to them in text count as links to its own files'
          sequence:
            type: string
            label: 'Domain'

key.type.content_relay_signing:
  type: content_relay.key_type_settings
  label: 'Content Relay signing key settings'

key.type.content_relay_encryption:
  type: content_relay.key_type_settings
  label: 'Content Relay encryption key settings'

content_relay.key_type_settings:
  type: mapping
  label: 'Content Relay key settings'
  mapping:
    status:
      type: string
      label: 'Status'
      constraints:
        Choice:
          - primary
          - active
          - retired

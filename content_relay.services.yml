services:
  logger.channel.content_relay:
    parent: logger.channel_base
    arguments: ['content_relay']

  content_relay.site_identity:
    class: Drupal\content_relay\SiteIdentity
    arguments: ['@config.factory']

  # Serialization.
  plugin.manager.content_relay_normalizer:
    class: Drupal\content_relay\Serialization\NormalizerManager
    parent: default_plugin_manager
    arguments: ['@entity_type.manager']

  plugin.manager.content_relay_field_normalizer:
    class: Drupal\content_relay\Serialization\FieldNormalizerManager
    parent: default_plugin_manager

  content_relay.path_translator:
    class: Drupal\content_relay\Serialization\PathTranslator
    arguments: ['@entity_type.manager', '@content_relay.uuid_resolver']

  content_relay.uuid_resolver:
    class: Drupal\content_relay\Serialization\UuidResolver
    arguments: ['@entity_type.manager', '@database', '@entity_field.manager']

  content_relay.entity_serializer:
    class: Drupal\content_relay\Serialization\EntitySerializer
    arguments:
      - '@plugin.manager.content_relay_normalizer'
      - '@entity.repository'
      - '@content_relay.uuid_resolver'
      - '@event_dispatcher'

  content_relay.syncable_entity_types:
    class: Drupal\content_relay\Serialization\SyncableEntityTypes
    arguments:
      - '@entity_type.manager'
      - '@entity_type.bundle.info'
      - '@plugin.manager.content_relay_normalizer'

  # Files.
  content_relay.file_checksums:
    class: Drupal\content_relay\File\FileChecksums
    arguments: ['@database']

  content_relay.file_url_mapper:
    class: Drupal\content_relay\File\FileUrlMapper
    arguments: ['@file_url_generator', '@entity_type.manager', '@config.factory', '@request_stack']

  content_relay.schema_describer:
    class: Drupal\content_relay\Schema\SchemaDescriber
    arguments: ['@entity_type.manager', '@entity_type.bundle.info', '@plugin.manager.content_relay_normalizer']

  content_relay.revision_hasher:
    class: Drupal\content_relay\Hash\RevisionHasher

  # Keys and messages.
  content_relay.key_store:
    class: Drupal\content_relay\Key\KeyStore
    arguments: ['@key.repository']

  content_relay.key_rotation:
    class: Drupal\content_relay\Key\KeyRotation
    arguments:
      - '@entity_type.manager'
      - '@content_relay.key_store'
      - '@logger.channel.content_relay'
      - '@current_user'
      - !tagged_iterator content_relay.key_announcer

  # Role modules add resolvers for their peers by tagging a service with
  # content_relay_public_key_resolver.
  content_relay.public_key_resolver:
    class: Drupal\content_relay\Crypto\ChainPublicKeyResolver
    tags:
      - { name: service_collector, tag: content_relay_public_key_resolver, call: addResolver }

  content_relay.replay_guard:
    class: Drupal\content_relay\Crypto\DatabaseReplayGuard
    arguments: ['@database']

  content_relay.message_signer:
    class: Drupal\content_relay\Crypto\MessageSigner
    arguments:
      - '@content_relay.key_store'
      - '@content_relay.site_identity'
      - '@datetime.time'
      - '@uuid'
      - '@content_relay.peer_policy'

  content_relay.message_verifier:
    class: Drupal\content_relay\Crypto\MessageVerifier
    arguments:
      - '@content_relay.public_key_resolver'
      - '@content_relay.replay_guard'
      - '@content_relay.site_identity'
      - '@config.factory'
      - '@datetime.time'
      - '@content_relay.key_store'
      - '@content_relay.peer_policy'

  # Role modules add a policy for their peers by tagging a service with
  # content_relay_peer_policy.
  content_relay.peer_policy:
    class: Drupal\content_relay\Crypto\PeerPolicy
    arguments: ['@config.factory']
    tags:
      - { name: service_collector, tag: content_relay_peer_policy, call: addPolicy }

  content_relay.contract_summarizer:
    class: Drupal\content_relay\Contract\ContractSummarizer
    arguments: ['@entity_type.bundle.info', '@language_manager', '@string_translation']

  content_relay.contract_renderer:
    class: Drupal\content_relay\Contract\ContractRenderer
    arguments: ['@content_relay.contract_summarizer', '@date.formatter', '@entity_type.manager', '@string_translation']

  # Authentication of replica requests to the origin. Swap the alias to use
  # another scheme, such as OAuth client credentials.
  content_relay.jwt_authenticator:
    class: Drupal\content_relay\Auth\JwtAuthenticator
    arguments:
      - '@content_relay.key_store'
      - '@content_relay.site_identity'
      - '@content_relay.public_key_resolver'
      - '@content_relay.replay_guard'
      - '@datetime.time'
      - '@uuid'

  content_relay.pull_authenticator:
    alias: content_relay.jwt_authenticator

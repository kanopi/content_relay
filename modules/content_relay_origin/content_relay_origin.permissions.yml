administer content relay origin:
  title: 'Administer Content Relay origin settings'
  description: 'Choose which bundles are published and how delivery and pairing behave.'
  restrict access: true
administer content relay replicas:
  title: 'Administer Content Relay replicas'
  description: 'Approve, suspend, resume and revoke replicas, and change what each may receive.'
  restrict access: true
generate content relay pairing codes:
  title: 'Generate Content Relay pairing codes'
  description: 'Anyone with a code can pair a replica that receives published content.'
  restrict access: true
push content relay items:
  title: 'Push Content Relay items'
  description: 'Send an item to replicas now, from its push form or Drush (manual resync).'
bulk push content relay items:
  title: 'Bulk push Content Relay items'
  description: 'Push many items at once from the status report (bulk resync), and refresh the report.'
view content relay status report:
  title: 'View the Content Relay status report'
  description: 'See which items are in sync on which replica.'
mark content relay items not syncable:
  title: 'Mark Content Relay items not syncable'
  description: 'Stop or resume sending individual items to replicas.'

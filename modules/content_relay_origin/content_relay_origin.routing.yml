route_callbacks:
  - 'content_relay_origin.item_routes:routes'

# Machine endpoints. Each authenticates the caller itself: pairing by code and
# a signature from the key being registered, the inbox by the signature of a
# registered replica. There is no session and no CSRF token.
content_relay_origin.pair:
  path: '/content-relay/v1/pair'
  defaults:
    _controller: '\Drupal\content_relay_origin\Controller\PairingController::pair'
  methods: [POST]
  requirements:
    # Open on purpose: authenticated by the pairing code and flood-limited.
    _access: 'TRUE'
  options:
    no_cache: TRUE

content_relay_origin.inbox:
  path: '/content-relay/v1/messages'
  defaults:
    _controller: '\Drupal\content_relay_origin\Controller\InboxController::receive'
  methods: [POST]
  requirements:
    # Open on purpose: every message is signature-checked by the controller.
    _access: 'TRUE'
  options:
    no_cache: TRUE

content_relay_origin.file_info:
  path: '/content-relay/v1/files/{uuid}'
  defaults:
    _controller: '\Drupal\content_relay_origin\Controller\FileController::info'
  methods: [GET]
  requirements:
    # Open on purpose: authenticated by the replica's JWT in the controller.
    _access: 'TRUE'
    uuid: '[0-9a-fA-F\-]{36}'
  options:
    no_cache: TRUE

content_relay_origin.file_download:
  path: '/content-relay/v1/files/{uuid}/download'
  defaults:
    _controller: '\Drupal\content_relay_origin\Controller\FileController::download'
  methods: [GET]
  requirements:
    # Open on purpose: authorized by the signed link, checked in the controller.
    _access: 'TRUE'
    uuid: '[0-9a-fA-F\-]{36}'
  options:
    no_cache: TRUE

content_relay_origin.schema:
  path: '/content-relay/v1/schema'
  defaults:
    _controller: '\Drupal\content_relay_origin\Controller\ReadController::schema'
  methods: [GET]
  requirements:
    # Open on purpose: authenticated by the replica's JWT in the controller.
    _access: 'TRUE'
  options:
    no_cache: TRUE

content_relay_origin.item:
  path: '/content-relay/v1/items/{entity_type}/{uuid}'
  defaults:
    _controller: '\Drupal\content_relay_origin\Controller\ReadController::item'
  methods: [GET]
  requirements:
    # Open on purpose: authenticated by the replica's JWT in the controller.
    _access: 'TRUE'
    entity_type: '[a-z0-9_]+'
    uuid: '[0-9a-fA-F\-]{36}'
  options:
    no_cache: TRUE

content_relay_origin.hashes:
  path: '/content-relay/v1/hashes'
  defaults:
    _controller: '\Drupal\content_relay_origin\Controller\ReadController::hashes'
  methods: [GET]
  requirements:
    # Open on purpose: authenticated by the replica's JWT in the controller.
    _access: 'TRUE'
  options:
    no_cache: TRUE

content_relay_origin.stream:
  path: '/content-relay/v1/stream'
  defaults:
    _controller: '\Drupal\content_relay_origin\Controller\ReadController::stream'
  methods: [GET]
  requirements:
    # Open on purpose: authenticated by the replica's JWT in the controller.
    _access: 'TRUE'
  options:
    no_cache: TRUE

# Administration.
content_relay_origin.settings:
  path: '/admin/config/services/content-relay/origin'
  defaults:
    _form: '\Drupal\content_relay_origin\Form\OriginSettingsForm'
    _title: 'Content Relay origin'
  requirements:
    _permission: 'administer content relay origin'

content_relay_origin.replicas:
  path: '/admin/config/services/content-relay/origin/replicas'
  defaults:
    _controller: '\Drupal\content_relay_origin\Controller\ReplicaListController::list'
    _title: 'Replicas'
  requirements:
    _permission: 'administer content relay replicas'

content_relay_origin.pairing_code:
  path: '/admin/config/services/content-relay/origin/pairing-code'
  defaults:
    _form: '\Drupal\content_relay_origin\Form\PairingCodeForm'
    _title: 'Generate a pairing code'
  requirements:
    _permission: 'generate content relay pairing codes'

content_relay_origin.replica_contract:
  path: '/admin/config/services/content-relay/origin/replicas/{replica_id}/contract'
  defaults:
    _form: '\Drupal\content_relay_origin\Form\ReplicaContractForm'
    _title: 'Contract'
  requirements:
    _permission: 'administer content relay replicas'

content_relay_origin.replica_sending:
  path: '/admin/config/services/content-relay/origin/replicas/{replica_id}/settings'
  defaults:
    _form: '\Drupal\content_relay_origin\Form\ReplicaSendingForm'
    _title: 'Settings'
  requirements:
    _permission: 'administer content relay replicas'

content_relay_origin.replica_addresses:
  path: '/admin/config/services/content-relay/origin/replicas/{replica_id}/addresses'
  defaults:
    _form: '\Drupal\content_relay_origin\Form\ReplicaAddressesForm'
    _title: 'Allowed addresses'
  requirements:
    _permission: 'administer content relay replicas'

content_relay_origin.replica_action:
  path: '/admin/config/services/content-relay/origin/replicas/{replica_id}/{action}'
  defaults:
    _form: '\Drupal\content_relay_origin\Form\ReplicaActionForm'
    _title: 'Change replica'
  requirements:
    _permission: 'administer content relay replicas'
    action: 'approve|suspend|resume|revoke'

content_relay_origin.bulk_push:
  path: '/admin/reports/content-relay/push'
  defaults:
    _form: '\Drupal\content_relay_origin\Form\BulkPushConfirmForm'
    _title: 'Push items'
  requirements:
    _permission: 'bulk push content relay items'

content_relay_origin.report_refresh:
  path: '/admin/reports/content-relay/refresh'
  defaults:
    _controller: '\Drupal\content_relay_origin\Controller\ReportController::refresh'
    _title: 'Refresh status'
  requirements:
    _permission: 'bulk push content relay items'
    _csrf_token: 'TRUE'

content_relay_origin.report_export:
  path: '/admin/reports/content-relay/export'
  defaults:
    _controller: '\Drupal\content_relay_origin\Controller\ReportController::export'
  requirements:
    _permission: 'view content relay status report'

content_relay_origin.event:
  path: '/admin/reports/content-relay/events/{row_id}'
  defaults:
    _controller: '\Drupal\content_relay_origin\Controller\EventLogController::view'
    _title: 'Event log entry'
  requirements:
    _permission: 'view content relay event log'
    row_id: '\d+'

content_relay_origin.event_replay:
  path: '/admin/reports/content-relay/events/{row_id}/replay'
  defaults:
    _form: '\Drupal\content_relay_origin\Form\ReplayForm'
    _title: 'Replay'
  requirements:
    _permission: 'replay content relay events'
    row_id: '\d+'

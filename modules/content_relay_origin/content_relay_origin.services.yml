services:
  logger.channel.content_relay_origin:
    parent: logger.channel_base
    arguments: ['content_relay_origin']

  content_relay_origin.replica_registry:
    class: Drupal\content_relay_origin\ReplicaRegistry
    arguments: ['@database', '@datetime.time']

  content_relay_origin.public_key_resolver:
    class: Drupal\content_relay_origin\ReplicaPublicKeyResolver
    arguments: ['@content_relay_origin.replica_registry']
    tags:
      - { name: content_relay_public_key_resolver }

  content_relay_origin.sync_scope:
    class: Drupal\content_relay_origin\SyncScope
    arguments: ['@config.factory', '@plugin.manager.content_relay_normalizer']

  content_relay_origin.hash_store:
    class: Drupal\content_relay_origin\HashStore
    arguments:
      - '@database'
      - '@content_relay.entity_serializer'
      - '@content_relay.revision_hasher'
      - '@datetime.time'

  content_relay_origin.outbox:
    class: Drupal\content_relay_origin\Outbox
    arguments:
      - '@database'
      - '@content_relay_origin.replica_registry'
      - '@config.factory'
      - '@datetime.time'
      - '@uuid'

  content_relay_origin.delivery_scheduler:
    class: Drupal\content_relay_origin\DeliveryScheduler
    arguments: ['@queue', '@content_relay_origin.outbox', '@datetime.time']

  content_relay_origin.change_recorder:
    class: Drupal\content_relay_origin\EntityChangeRecorder
    arguments:
      - '@content_relay_origin.sync_scope'
      - '@content_relay_origin.hash_store'
      - '@content_relay_origin.outbox'
      - '@content_relay_origin.delivery_scheduler'
      - '@content_relay_origin.replica_registry'
      - '@content_relay_origin.contract_manager'
      - '@content_relay_origin.not_syncable'
      - '@content_relay_origin.report'
      - '@content_relay_origin.replica_items'
      - '@content_relay_origin.translation_blocks'

  content_relay_origin.event_builder:
    class: Drupal\content_relay_origin\EventBuilder
    arguments:
      - '@entity.repository'
      - '@entity_type.manager'
      - '@content_relay.entity_serializer'
      - '@content_relay.revision_hasher'
      - '@content_relay_origin.hash_store'
      - '@content_relay_origin.sync_scope'
      - '@content_relay_origin.not_syncable'
      - '@datetime.time'
      - '@content_relay_origin.file_links'
      - '@content_relay.file_checksums'
      - '@file_url_generator'
      - '@content_relay_origin.file_keys'
      - '@content_relay_origin.translation_blocks'

  content_relay_origin.delivery:
    class: Drupal\content_relay_origin\DeliveryService
    arguments:
      - '@content_relay_origin.replica_registry'
      - '@content_relay_origin.outbox'
      - '@content_relay_origin.event_builder'
      - '@content_relay_origin.contract_manager'
      - '@content_relay_origin.replica_items'
      - '@content_relay_origin.sync_scope'
      - '@content_relay_origin.not_syncable'
      - '@content_relay_origin.report'
      - '@entity.repository'
      - '@content_relay.message_signer'
      - '@http_client'
      - '@lock'
      - '@config.factory'
      - '@datetime.time'
      - '@logger.channel.content_relay_origin'

  content_relay_origin.replay:
    class: Drupal\content_relay_origin\ReplayService
    arguments:
      - '@content_relay_origin.outbox'
      - '@content_relay_origin.hash_store'
      - '@content_relay_origin.delivery_scheduler'
      - '@entity.repository'
      - '@current_user'
      - '@logger.channel.content_relay_origin'

  content_relay_origin.pairing_codes:
    class: Drupal\content_relay_origin\PairingCodes
    arguments: ['@database', '@config.factory', '@datetime.time']

  content_relay_origin.contract_negotiator:
    class: Drupal\content_relay_origin\ContractNegotiator
    arguments: ['@content_relay_origin.sync_scope']

  content_relay_origin.contract_manager:
    class: Drupal\content_relay_origin\ContractManager
    arguments:
      - '@database'
      - '@content_relay_origin.replica_registry'
      - '@content_relay_origin.outbox'
      - '@content_relay_origin.contract_negotiator'
      - '@content_relay.message_signer'
      - '@content_relay.message_verifier'
      - '@content_relay.site_identity'
      - '@content_relay.key_store'
      - '@http_client'
      - '@config.factory'
      - '@datetime.time'
      - '@logger.channel.content_relay_origin'
      - '@content_relay_origin.replica_policy'

  content_relay_origin.pairing:
    class: Drupal\content_relay_origin\PairingService
    arguments:
      - '@content_relay_origin.pairing_codes'
      - '@content_relay_origin.replica_registry'
      - '@content_relay_origin.contract_manager'
      - '@content_relay.key_store'
      - '@content_relay.site_identity'
      - '@flood'
      - '@config.factory'
      - '@datetime.time'
      - '@logger.channel.content_relay_origin'

  content_relay_origin.replica_items:
    class: Drupal\content_relay_origin\ReplicaItems
    arguments: ['@database', '@datetime.time']

  content_relay_origin.not_syncable:
    class: Drupal\content_relay_origin\NotSyncableFlags
    arguments: ['@database', '@datetime.time']

  content_relay_origin.item_sync_control:
    class: Drupal\content_relay_origin\ItemSyncControl
    arguments:
      - '@content_relay_origin.not_syncable'
      - '@content_relay_origin.outbox'
      - '@content_relay_origin.delivery_scheduler'
      - '@content_relay_origin.hash_store'
      - '@content_relay_origin.replica_items'
      - '@content_relay_origin.replica_registry'
      - '@content_relay_origin.contract_manager'
      - '@content_relay_origin.sync_scope'
      - '@content_relay_origin.report'
      - '@config.factory'
      - '@current_user'
      - '@logger.channel.content_relay_origin'
      - '@content_relay_origin.translation_blocks'

  content_relay_origin.manual_push:
    class: Drupal\content_relay_origin\ManualPush
    arguments:
      - '@content_relay_origin.item_sync_control'
      - '@content_relay_origin.outbox'
      - '@content_relay_origin.replica_items'
      - '@content_relay_origin.hash_store'
      - '@content_relay_origin.replica_registry'
      - '@content_relay_origin.contract_manager'
      - '@content_relay_origin.delivery'
      - '@current_user'
      - '@logger.channel.content_relay_origin'

  content_relay_origin.bulk_push:
    class: Drupal\content_relay_origin\BulkPush
    arguments:
      - '@database'
      - '@content_relay_origin.item_sync_control'
      - '@content_relay_origin.outbox'
      - '@content_relay_origin.replica_items'
      - '@content_relay_origin.hash_store'
      - '@content_relay_origin.delivery_scheduler'
      - '@current_user'
      - '@logger.channel.content_relay_origin'

  content_relay_origin.report:
    class: Drupal\content_relay_origin\Report\ReportIndex
    arguments:
      - '@database'
      - '@entity.repository'
      - '@entity_type.manager'
      - '@content_relay_origin.hash_store'
      - '@content_relay_origin.replica_items'
      - '@content_relay_origin.outbox'
      - '@content_relay_origin.not_syncable'
      - '@content_relay_origin.replica_registry'
      - '@content_relay_origin.contract_manager'
      - '@content_relay_origin.sync_scope'
      - '@datetime.time'
      - '@content_relay_origin.translation_blocks'

  content_relay_origin.report_rebuild:
    class: Drupal\content_relay_origin\Report\ReportRebuild
    arguments:
      - '@content_relay_origin.report'
      - '@content_relay_origin.sync_scope'
      - '@content_relay_origin.replica_registry'
      - '@content_relay_origin.contract_manager'
      - '@database'
      - '@queue'
      - '@state'

  content_relay_origin.entity_ui:
    class: Drupal\content_relay_origin\EntityUi
    arguments:
      - '@content_relay_origin.sync_scope'
      - '@content_relay_origin.not_syncable'
      - '@content_relay_origin.item_sync_control'
      - '@content_relay_origin.manual_push'
      - '@current_user'

  content_relay_origin.item_routes:
    class: Drupal\content_relay_origin\Routing\ItemRoutes
    arguments: ['@content_relay.syncable_entity_types']

  content_relay_origin.item_access:
    class: Drupal\content_relay_origin\Access\ItemAccessCheck
    arguments: ['@content_relay_origin.sync_scope']
    tags:
      - { name: access_check, applies_to: _content_relay_item }

  content_relay_origin.report_views:
    class: Drupal\content_relay_origin\Report\ReportViews
    arguments: ['@entity_type.manager', '@views.executable', '@current_user']

  content_relay_origin.report_views_data:
    class: Drupal\content_relay_origin\Report\ReportViewsData
    arguments: ['@content_relay.syncable_entity_types']

  content_relay_origin.file_links:
    class: Drupal\content_relay_origin\File\FileLinks
    arguments: ['@content_relay.key_store', '@config.factory', '@datetime.time']

  content_relay_origin.file_access:
    class: Drupal\content_relay_origin\File\FileAccess
    arguments:
      - '@content_relay_origin.hash_store'
      - '@content_relay_origin.sync_scope'
      - '@content_relay_origin.contract_manager'
      - '@content_relay_origin.not_syncable'
      - '@content_relay_origin.replica_registry'
      - '@entity.repository'

  content_relay_origin.replica_policy:
    class: Drupal\content_relay_origin\Crypto\ReplicaPolicy
    arguments:
      - '@database'
      - '@content_relay_origin.replica_registry'
      - '@state'
      - '@config.factory'
      - '@datetime.time'
    tags:
      - { name: content_relay_peer_policy }

  content_relay.key_announcer:
    class: Drupal\content_relay_origin\Crypto\ReplicaKeyAnnouncer
    arguments:
      - '@content_relay_origin.replica_registry'
      - '@content_relay_origin.contract_manager'
      - '@current_user'

  content_relay_origin.file_keys:
    class: Drupal\content_relay_origin\File\FileKeys
    arguments: ['@content_relay.key_store']

  content_relay_origin.status_poller:
    class: Drupal\content_relay_origin\StatusPoller
    arguments:
      - '@content_relay_origin.outbox'
      - '@content_relay_origin.replica_registry'
      - '@content_relay_origin.replica_items'
      - '@content_relay_origin.hash_store'
      - '@content_relay_origin.contract_manager'
      - '@content_relay.message_signer'
      - '@content_relay.message_verifier'
      - '@content_relay_origin.report'
      - '@http_client'
      - '@config.factory'
      - '@datetime.time'
      - '@logger.channel.content_relay_origin'

  content_relay_origin.replica_requests:
    class: Drupal\content_relay_origin\ReplicaRequests
    arguments:
      - '@content_relay.pull_authenticator'
      - '@content_relay_origin.replica_registry'
      - '@content_relay.message_signer'
      - '@logger.channel.content_relay_origin'
      - '@config.factory'
      - '@keyvalue.expirable'
      - '@datetime.time'

  content_relay_origin.hash_backfill:
    class: Drupal\content_relay_origin\HashBackfill
    arguments: ['@entity_type.manager', '@content_relay_origin.sync_scope', '@content_relay_origin.hash_store']

  content_relay_origin.reconciler:
    class: Drupal\content_relay_origin\OriginReconciler
    arguments:
      - '@database'
      - '@content_relay_origin.report'
      - '@content_relay_origin.bulk_push'
      - '@queue'
      - '@config.factory'
      - '@state'
      - '@datetime.time'
      - '@logger.channel.content_relay_origin'

  content_relay_origin.language_notices:
    class: Drupal\content_relay_origin\LanguageNotices
    arguments:
      - '@content_relay_origin.replica_registry'
      - '@content_relay.message_signer'
      - '@http_client'
      - '@state'
      - '@logger.channel.content_relay_origin'

  content_relay_origin.translation_blocks:
    class: Drupal\content_relay_origin\TranslationBlocks
    arguments: ['@database', '@datetime.time']

  content_relay_origin.item_validator:
    class: Drupal\content_relay_origin\ItemValidator
    arguments:
      - '@content_relay_origin.hash_store'
      - '@content_relay.entity_serializer'
      - '@content_relay.revision_hasher'
      - '@content_relay_origin.replica_registry'
      - '@content_relay_origin.contract_manager'
      - '@content_relay_origin.not_syncable'
      - '@content_relay_origin.replica_items'
      - '@content_relay_origin.event_builder'
      - '@content_relay_origin.report'
      - '@content_relay.message_signer'
      - '@content_relay.message_verifier'
      - '@http_client'
      - '@entity_type.manager'
      - '@logger.channel.content_relay_origin'

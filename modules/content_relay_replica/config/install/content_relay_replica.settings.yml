webhook_url: ''
origin_allowed_ips: []
failures:
  transient_retry_limit: 5
  retry_base: 60
  retry_max: 3600
processed_retention_days: 60
external_references:
  fallbacks:
    user: '0'
local_only: []
languages:
  map: []
  unknown: skip
  removed: keep
conflicts:
  on_event: overwrite
moderation:
  target_state: ''
reconcile:
  interval: 86400
  max_items: 100
detach:
  follow_deletes: false
files:
  pending: publish
  links: local
  max_attempts: 5
  retry_base: 300
  timeout: 300
  fetch_on_miss: redirect
  verify_interval: 86400
processing:
  auto_backlog: 50
  auto_max_load: 0
  status_batch_limit: 200
  lock_wait: 30

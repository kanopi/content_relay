content_relay_replica.settings:
  type: config_object
  label: 'Content Relay Replica settings'
  mapping:
    webhook_url:
      type: string
      label: 'Endpoint URL to give the origin, when the site cannot work it out (for example behind a proxy). Empty to use this site''s own address.'
    failures:
      type: mapping
      label: 'Save failures'
      mapping:
        transient_retry_limit:
          type: integer
          label: 'Local retries of a transient failure before it is treated as permanent'
        retry_base:
          type: integer
          label: 'First retry delay, in seconds'
        retry_max:
          type: integer
          label: 'Longest retry delay, in seconds'
    external_references:
      type: mapping
      label: 'References to content this replica does not subscribe to'
      mapping:
        fallbacks:
          type: sequence
          label: 'Local entity ID to use instead, by entity type. Types not listed leave the reference out.'
          sequence:
            type: string
            label: 'Local entity ID'
    processed_retention_days:
      type: integer
      label: 'Days to remember processed event IDs'
    detach:
      type: mapping
      label: 'Items detached on this replica'
      mapping:
        follow_deletes:
          type: boolean
          label: 'Delete a detached item when the origin deletes it'

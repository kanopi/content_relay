content_relay_replica.settings:
  type: config_object
  label: 'Content Relay Replica settings'
  mapping:
    webhook_url:
      type: string
      label: 'Endpoint URL to give the origin, when the site cannot work it out (for example behind a proxy). Empty to use this site''s own address.'
    failures:
      type: mapping
      label: 'Save failures'
      mapping:
        transient_retry_limit:
          type: integer
          label: 'Local retries of a transient failure before it is treated as permanent'
        retry_base:
          type: integer
          label: 'First retry delay, in seconds'
        retry_max:
          type: integer
          label: 'Longest retry delay, in seconds'
    external_references:
      type: mapping
      label: 'References to content this replica does not subscribe to'
      mapping:
        fallbacks:
          type: sequence
          label: 'Local entity ID to use instead, by entity type. Types not listed leave the reference out.'
          sequence:
            type: string
            label: 'Local entity ID'
    processed_retention_days:
      type: integer
      label: 'Days to remember processed event IDs'
    local_only:
      type: sequence
      label: 'Fields this site keeps for itself: never synced, not hashed'
      sequence:
        type: mapping
        label: 'Local-only fields of a bundle'
        mapping:
          entity_type:
            type: string
            label: 'Entity type'
          bundle:
            type: string
            label: 'Bundle'
          fields:
            type: sequence
            label: 'Field names'
            sequence:
              type: string
              label: 'Field name'
    conflicts:
      type: mapping
      label: 'Items edited here when the origin sends an update'
      mapping:
        on_event:
          type: string
          label: 'Save the origin version as a new revision and flag for review (overwrite), or keep the local copy and mark a conflict (reject)'
          constraints:
            Choice:
              - overwrite
              - reject
    reconcile:
      type: mapping
      label: 'Reconciliation'
      mapping:
        interval:
          type: integer
          label: 'Seconds between scheduled reconciliation runs; 0 to run only on demand'
    detach:
      type: mapping
      label: 'Items detached on this replica'
      mapping:
        follow_deletes:
          type: boolean
          label: 'Delete a detached item when the origin deletes it'
    files:
      type: mapping
      label: 'Files'
      mapping:
        pending:
          type: string
          label: 'Content whose files have not arrived: publish as received, or hold unpublished'
          constraints:
            Choice:
              - publish
              - hold
        links:
          type: string
          label: 'Links to files in text point at this site''s copies (local) or the origin''s (origin)'
          constraints:
            Choice:
              - local
              - origin
        max_attempts:
          type: integer
          label: 'Download attempts before a file is marked as failed'
        retry_base:
          type: integer
          label: 'First retry delay, in seconds'
        timeout:
          type: integer
          label: 'Download timeout, in seconds'
        fetch_on_miss:
          type: string
          label: 'When a synced file is requested and missing here: off, redirect to the origin, or placeholder'
          constraints:
            Choice:
              - 'off'
              - redirect
              - placeholder
        verify_interval:
          type: integer
          label: 'Seconds between checks that every synced file is present and intact; 0 to disable'
    processing:
      type: mapping
      label: 'Processing'
      mapping:
        auto_backlog:
          type: integer
          label: 'In auto mode, queue events while this many are already waiting; 0 to ignore'
        auto_max_load:
          type: float
          label: 'In auto mode, queue events while the one-minute load average is at least this; 0 to ignore'
        status_batch_limit:
          type: integer
          label: 'Most event IDs the origin may ask about at once'
        lock_wait:
          type: integer
          label: 'Seconds to wait for an item another process is writing, before answering busy'

content_relay_replica.mapping.*:
  type: config_entity
  label: 'Content Relay mapping'
  mapping:
    id:
      type: machine_name
      label: 'ID'
    label:
      type: label
      label: 'Label'
    source_entity_type:
      type: string
      label: 'Origin entity type'
    source_bundle:
      type: string
      label: 'Origin bundle'
    target_entity_type:
      type: string
      label: 'Entity type here'
    target_bundle:
      type: string
      label: 'Bundle here'
    fields:
      type: sequence
      label: 'Field mappings'
      sequence:
        type: mapping
        label: 'Field mapping'
        mapping:
          source:
            type: string
            label: 'Origin field or property; empty for a value from transforms only'
          target:
            type: string
            label: 'Field or property here'
          process:
            type: sequence
            label: 'Transforms, in order'
            sequence:
              type: mapping
              label: 'Transform'
              mapping:
                plugin:
                  type: string
                  label: 'Transform plugin'
                configuration:
                  type: content_relay_replica.transform.[%parent.plugin]
                  label: 'Transform configuration'
    unmapped_required:
      type: string
      label: 'Required fields here that are not mapped'
      constraints:
        Choice:
          - reject
          - allow
    ignored_source_fields:
      type: sequence
      label: 'Origin fields knowingly not mapped'
      sequence:
        type: string
        label: 'Field'
    local_only:
      type: sequence
      label: 'Fields here that sync never writes'
      sequence:
        type: string
        label: 'Field'
    translation:
      type: mapping
      label: 'Translations'
      mapping:
        untranslatable_source:
          type: string
          label: 'Origin language for fields not translatable here: default, or a langcode'

content_relay_replica.transform.*:
  type: mapping
  label: 'Transform configuration'
  mapping: {}

content_relay_replica.transform.static_value:
  type: mapping
  label: 'Static value'
  mapping:
    value:
      type: string
      label: 'Value'

content_relay_replica.transform.default_value:
  type: mapping
  label: 'Default value'
  mapping:
    value:
      type: string
      label: 'Value'

content_relay_replica.transform.text_format:
  type: mapping
  label: 'Text format'
  mapping:
    map:
      type: sequence
      label: 'Origin format to format here'
      sequence:
        type: string
        label: 'Format here'
    default:
      type: string
      label: 'Format for others'

content_relay_replica.transform.taxonomy_lookup:
  type: mapping
  label: 'Taxonomy lookup'
  mapping:
    vocabulary:
      type: string
      label: 'Vocabulary'
    missing:
      type: string
      label: 'When a term is not here: skip or reject'

content_relay_replica.transform.date_format:
  type: mapping
  label: 'Date format'
  mapping:
    from_format:
      type: string
      label: 'Origin format'
    to_format:
      type: string
      label: 'Format here'
    timezone:
      type: string
      label: 'Timezone'

content_relay_replica.transform.concat:
  type: mapping
  label: 'Concatenate'
  mapping:
    sources:
      type: sequence
      label: 'More origin fields or properties'
      sequence:
        type: string
        label: 'Field or property'
    delimiter:
      type: string
      label: 'Delimiter'

content_relay_replica.transform.callback:
  type: mapping
  label: 'Callback'
  mapping:
    callable:
      type: string
      label: 'Function or static method'

content_relay_replica.settings:
  type: config_object
  label: 'Content Relay Replica settings'
  mapping:
    webhook_url:
      type: string
      label: 'Endpoint URL to give the origin, when the site cannot work it out (for example behind a proxy). Empty to use this site''s own address.'
    failures:
      type: mapping
      label: 'Save failures'
      mapping:
        transient_retry_limit:
          type: integer
          label: 'Local retries of a transient failure before it is treated as permanent'
        retry_base:
          type: integer
          label: 'First retry delay, in seconds'
        retry_max:
          type: integer
          label: 'Longest retry delay, in seconds'
    external_references:
      type: mapping
      label: 'References to content this replica does not subscribe to'
      mapping:
        fallbacks:
          type: sequence
          label: 'Local entity ID to use instead, by entity type. Types not listed leave the reference out.'
          sequence:
            type: string
            label: 'Local entity ID'
    processed_retention_days:
      type: integer
      label: 'Days to remember processed event IDs'
    detach:
      type: mapping
      label: 'Items detached on this replica'
      mapping:
        follow_deletes:
          type: boolean
          label: 'Delete a detached item when the origin deletes it'
    files:
      type: mapping
      label: 'Files'
      mapping:
        pending:
          type: string
          label: 'Content whose files have not arrived: publish as received, or hold unpublished'
          constraints:
            Choice:
              - publish
              - hold
        links:
          type: string
          label: 'Links to files in text point at this site''s copies (local) or the origin''s (origin)'
          constraints:
            Choice:
              - local
              - origin
        max_attempts:
          type: integer
          label: 'Download attempts before a file is marked as failed'
        retry_base:
          type: integer
          label: 'First retry delay, in seconds'
        timeout:
          type: integer
          label: 'Download timeout, in seconds'
        fetch_on_miss:
          type: string
          label: 'When a synced file is requested and missing here: off, redirect to the origin, or placeholder'
          constraints:
            Choice:
              - 'off'
              - redirect
              - placeholder
        verify_interval:
          type: integer
          label: 'Seconds between checks that every synced file is present and intact; 0 to disable'

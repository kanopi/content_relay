# Authentication is the signature on every message, checked by the controller
# before anything else happens. There is no session and no CSRF token: the
# caller is another site, not a browser.
content_relay_replica.receive_events:
  path: '/content-relay/v1/events'
  defaults:
    _controller: '\Drupal\content_relay_replica\Controller\EventReceiverController::receive'
  methods: [POST]
  requirements:
    # Open on purpose: every message is signature-checked by the controller.
    _access: 'TRUE'
  options:
    no_cache: TRUE

content_relay_replica.subscription:
  path: '/admin/config/services/content-relay/replica'
  defaults:
    _form: '\Drupal\content_relay_replica\Form\SubscriptionForm'
    _title: 'Content Relay replica'
  requirements:
    _permission: 'change content relay subscription'

content_relay_replica.settings:
  path: '/admin/config/services/content-relay/replica/settings'
  defaults:
    _form: '\Drupal\content_relay_replica\Form\ReplicaSettingsForm'
    _title: 'Content Relay replica settings'
  requirements:
    _permission: 'administer content relay replica'

content_relay_replica.pair:
  path: '/admin/config/services/content-relay/replica/pair'
  defaults:
    _form: '\Drupal\content_relay_replica\Form\PairForm'
    _title: 'Pair with an origin'
  requirements:
    _permission: 'administer content relay replica'

content_relay_replica.detach:
  path: '/admin/content/content-relay/{entity_type_id}/{uuid}/detach'
  defaults:
    _form: '\Drupal\content_relay_replica\Form\DetachForm'
    _title: 'Detach'
  requirements:
    _permission: 'detach content relay items'
  options:
    _admin_route: TRUE

content_relay_replica.reattach:
  path: '/admin/content/content-relay/{entity_type_id}/{uuid}/reattach'
  defaults:
    _form: '\Drupal\content_relay_replica\Form\ReattachForm'
    _title: 'Reattach'
  requirements:
    _permission: 'detach content relay items'
  options:
    _admin_route: TRUE

content_relay_replica.bulk_detach:
  path: '/admin/reports/content-relay/received/{operation}'
  defaults:
    _form: '\Drupal\content_relay_replica\Form\BulkDetachConfirmForm'
    _title: 'Detach or reattach items'
  requirements:
    _permission: 'detach content relay items'
    operation: 'detach|reattach'

content_relay_replica.pull:
  path: '/admin/content/content-relay/{entity_type_id}/{uuid}/pull'
  defaults:
    _form: '\Drupal\content_relay_replica\Form\ItemPullForm'
    _title: 'Pull latest from origin'
  requirements:
    _permission: 'pull content relay items+resolve content relay conflicts'
  options:
    _admin_route: TRUE

content_relay_replica.validate:
  path: '/admin/content/content-relay/{entity_type_id}/{uuid}/validate'
  defaults:
    _form: '\Drupal\content_relay_replica\Form\ValidateForm'
    _title: 'Validate'
  requirements:
    _permission: 'view content relay replica report'
  options:
    _admin_route: TRUE

content_relay_replica.pull_uuid:
  path: '/admin/content/content-relay/pull'
  defaults:
    _form: '\Drupal\content_relay_replica\Form\PullByUuidForm'
    _title: 'Pull an item by UUID'
  requirements:
    _permission: 'pull content relay items'
  options:
    _admin_route: TRUE

content_relay_replica.pull_files:
  path: '/admin/content/content-relay/{entity_type_id}/{uuid}/pull-files'
  defaults:
    _form: '\Drupal\content_relay_replica\Form\PullFilesForm'
    _title: 'Pull files'
  requirements:
    _permission: 'pull content relay items'
  options:
    _admin_route: TRUE

content_relay_replica.mapping_reapply:
  path: '/admin/config/services/content-relay/replica/mappings/{content_relay_mapping}/reapply'
  defaults:
    _form: '\Drupal\content_relay_replica\Form\MappingReapplyForm'
    _title: 'Re-apply mapping'
  requirements:
    _permission: 'administer content relay mappings'
  options:
    parameters:
      content_relay_mapping:
        type: entity:content_relay_mapping

content_relay_replica.reconcile:
  path: '/admin/reports/content-relay/received/reconciliation'
  defaults:
    _form: '\Drupal\content_relay_replica\Form\ReconcileForm'
    _title: 'Reconciliation'
  requirements:
    _permission: 'reconcile content relay items'

content_relay_replica.failures:
  path: '/admin/reports/content-relay/received/failures'
  defaults:
    _form: '\Drupal\content_relay_replica\Form\FailuresForm'
    _title: 'Content Relay save failures'
  requirements:
    _permission: 'view content relay replica report'

content_relay_replica.failure:
  path: '/admin/reports/content-relay/received/failures/{failure_id}'
  defaults:
    _form: '\Drupal\content_relay_replica\Form\FailureForm'
    _title: 'Save failure'
  requirements:
    _permission: 'view content relay replica report'
    failure_id: '\d+'

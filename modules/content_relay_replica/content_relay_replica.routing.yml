# Authentication is the signature on every message, checked by the controller
# before anything else happens. There is no session and no CSRF token: the
# caller is another site, not a browser.
content_relay_replica.receive_events:
  path: '/content-relay/v1/events'
  defaults:
    _controller: '\Drupal\content_relay_replica\Controller\EventReceiverController::receive'
  methods: [POST]
  requirements:
    # Open on purpose: every message is signature-checked by the controller.
    _access: 'TRUE'
  options:
    no_cache: TRUE

content_relay_replica.subscription:
  path: '/admin/config/services/content-relay/replica'
  defaults:
    _form: '\Drupal\content_relay_replica\Form\SubscriptionForm'
    _title: 'Content Relay replica'
  requirements:
    _permission: 'change content relay subscription'

content_relay_replica.pair:
  path: '/admin/config/services/content-relay/replica/pair'
  defaults:
    _form: '\Drupal\content_relay_replica\Form\PairForm'
    _title: 'Pair with an origin'
  requirements:
    _permission: 'administer content relay replica'

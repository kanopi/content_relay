administer content relay replica:
  title: 'Administer Content Relay replica'
  description: 'Pair this site with an origin and change replica settings.'
  restrict access: true
change content relay subscription:
  title: 'Change the Content Relay subscription'
  description: 'Choose which content and languages this site receives, and pause delivery.'
  restrict access: true
change content relay languages:
  title: 'Change the languages received through Content Relay'
  description: 'Choose which languages this site receives, and add or ignore languages the origin adds.'
detach content relay items:
  title: 'Detach and reattach Content Relay items'
  description: 'Stop or resume applying origin updates to individual items.'
pull content relay items:
  title: 'Pull Content Relay items and files'
  description: 'Fetch the latest version of items and files from the origin.'
resolve content relay conflicts:
  title: 'Resolve Content Relay conflicts'
  description: 'Replace local edits with the origin version, or keep them and detach the item.'
reconcile content relay items:
  title: 'Run Content Relay reconciliation'
  description: 'Compare this site with the origin, pulling and deleting items to match, and see past runs.'
  restrict access: true
view content relay replica report:
  title: 'View the Content Relay replica report'
  description: 'See the sync status of every item received from the origin.'
administer content relay mappings:
  title: 'Administer Content Relay mappings'
  description: 'Map origin bundles onto this site''s structure, and re-apply mappings. Mappings can call PHP functions through the callback transform.'
  restrict access: true

services:
  logger.channel.content_relay_replica:
    parent: logger.channel_base
    arguments: ['content_relay_replica']

  content_relay_replica.origin:
    class: Drupal\content_relay_replica\OriginPeer
    arguments: ['@state']

  content_relay_replica.public_key_resolver:
    class: Drupal\content_relay_replica\OriginPublicKeyResolver
    arguments: ['@content_relay_replica.origin']
    tags:
      - { name: content_relay_public_key_resolver }

  content_relay_replica.sync_state:
    class: Drupal\content_relay_replica\SyncStateStore
    arguments: ['@database', '@datetime.time']

  content_relay_replica.stream:
    class: Drupal\content_relay_replica\StreamTracker
    arguments: ['@database', '@datetime.time']

  content_relay_replica.processed_events:
    class: Drupal\content_relay_replica\ProcessedEvents
    arguments: ['@database', '@config.factory', '@datetime.time']

  content_relay_replica.failed_events:
    class: Drupal\content_relay_replica\FailedEventStore
    arguments: ['@database', '@queue', '@config.factory', '@datetime.time', '@content_relay_replica.contracts', '@content_relay.key_store', '@cache_tags.invalidator']

  content_relay_replica.failure_classifier:
    class: Drupal\content_relay_replica\Apply\FailureClassifier

  content_relay_replica.applier:
    class: Drupal\content_relay_replica\Apply\SyncApplier
    arguments:
      - '@entity_type.manager'
      - '@entity.repository'
      - '@content_relay.entity_serializer'
      - '@content_relay.revision_hasher'
      - '@content_relay_replica.sync_state'
      - '@content_relay_replica.processed_events'
      - '@content_relay_replica.failed_events'
      - '@content_relay_replica.failure_classifier'
      - '@content_relay_replica.origin'
      - '@content_relay_replica.contracts'
      - '@database'
      - '@lock'
      - '@event_dispatcher'
      - '@config.factory'
      - '@datetime.time'
      - '@logger.channel.content_relay_replica'
      - '@content_relay_replica.local_changes'
      - '@content_relay_replica.file_sync'
      - '@content_relay_replica.mappings'
      - '@content_relay_replica.mapped_importer'
      - '@content_relay_replica.local_only_fields'
      - '@content_relay_replica.language_map'
      - '@content_relay_replica.moderation'

  content_relay_replica.contracts:
    class: Drupal\content_relay_replica\ContractStore
    arguments: ['@database', '@datetime.time']

  content_relay_replica.subscription:
    class: Drupal\content_relay_replica\SubscriptionManager
    arguments:
      - '@content_relay_replica.origin'
      - '@content_relay_replica.contracts'
      - '@content_relay.key_store'
      - '@content_relay.site_identity'
      - '@content_relay.message_signer'
      - '@content_relay.message_verifier'
      - '@http_client'
      - '@state'
      - '@database'
      - '@config.factory'
      - '@datetime.time'
      - '@logger.channel.content_relay_replica'
      - '@content_relay_replica.origin_policy'
      - '@content_relay_replica.language_subscription'

  content_relay_replica.local_changes:
    class: Drupal\content_relay_replica\LocalChanges
    arguments:
      - '@content_relay.entity_serializer'
      - '@content_relay.revision_hasher'
      - '@content_relay_replica.local_only_fields'
      - '@database'
      - '@content_relay_replica.origin'
      - '@config.factory'
      - '@entity.repository'
      - '@entity_type.manager'
      - '@content_relay_replica.language_map'

  content_relay_replica.local_only_fields:
    class: Drupal\content_relay_replica\LocalOnlyFields
    arguments: ['@config.factory', '@entity_type.manager']

  content_relay_replica.origin_client:
    class: Drupal\content_relay_replica\OriginClient
    arguments:
      - '@content_relay_replica.origin'
      - '@content_relay.message_signer'
      - '@http_client'
      - '@state'
      - '@logger.channel.content_relay_replica'
      - '@content_relay.pull_authenticator'
      - '@content_relay.message_verifier'

  content_relay_replica.detacher:
    class: Drupal\content_relay_replica\ItemDetacher
    arguments:
      - '@content_relay_replica.sync_state'
      - '@content_relay_replica.local_changes'
      - '@content_relay_replica.origin_client'
      - '@entity.repository'
      - '@current_user'
      - '@datetime.time'
      - '@logger.channel.content_relay_replica'

  content_relay_replica.entity_ui:
    class: Drupal\content_relay_replica\EntityUi
    arguments: ['@content_relay_replica.sync_state', '@current_user']

  content_relay_replica.sync_state_views_data:
    class: Drupal\content_relay_replica\Report\SyncStateViewsData
    arguments: ['@content_relay.syncable_entity_types']

  # Replace to fetch binaries some other way, such as from replicated storage.
  content_relay_replica.file_transport:
    class: Drupal\content_relay_replica\File\HttpFileTransport
    arguments: ['@http_client', '@content_relay_replica.origin', '@config.factory']

  content_relay_replica.file_sync:
    class: Drupal\content_relay_replica\File\FileSync
    arguments:
      - '@database'
      - '@queue'
      - '@content_relay_replica.file_transport'
      - '@content_relay_replica.origin_client'
      - '@content_relay_replica.origin'
      - '@content_relay.file_checksums'
      - '@file_system'
      - '@content_relay.file_url_mapper'
      - '@entity.repository'
      - '@content_relay_replica.sync_state'
      - '@content_relay.entity_serializer'
      - '@content_relay_replica.local_changes'
      - '@config.factory'
      - '@datetime.time'
      - '@logger.channel.content_relay_replica'

  content_relay_replica.fetch_on_miss:
    class: Drupal\content_relay_replica\EventSubscriber\FetchOnMiss
    arguments:
      - '@content_relay.file_url_mapper'
      - '@entity_type.manager'
      - '@content_relay_replica.sync_state'
      - '@content_relay_replica.file_sync'
      - '@config.factory'
    tags:
      - { name: event_subscriber }

  content_relay_replica.origin_policy:
    class: Drupal\content_relay_replica\Crypto\OriginPolicy
    arguments:
      - '@content_relay_replica.origin'
      - '@content_relay_replica.contracts'
      - '@state'
      - '@config.factory'
      - '@datetime.time'
    tags:
      - { name: content_relay_peer_policy }

  content_relay.key_announcer:
    class: Drupal\content_relay_replica\Crypto\OriginKeyAnnouncer
    arguments:
      - '@content_relay_replica.subscription'
      - '@content_relay_replica.origin'
      - '@current_user'

  content_relay_replica.received_events:
    class: Drupal\content_relay_replica\Processing\ReceivedEvents
    arguments: ['@database', '@queue', '@datetime.time']

  content_relay_replica.processing_policy:
    class: Drupal\content_relay_replica\Processing\ProcessingPolicy
    arguments:
      - '@content_relay_replica.contracts'
      - '@content_relay_replica.received_events'
      - '@lock'
      - '@config.factory'

  content_relay_replica.status_report:
    class: Drupal\content_relay_replica\Processing\StatusReport
    arguments:
      - '@content_relay_replica.processed_events'
      - '@content_relay_replica.received_events'
      - '@content_relay_replica.contracts'
      - '@content_relay_replica.stream'

  plugin.manager.content_relay_transform:
    class: Drupal\content_relay_replica\Mapping\TransformManager
    parent: default_plugin_manager

  content_relay_replica.mapped_importer:
    class: Drupal\content_relay_replica\Mapping\MappedImporter
    arguments:
      - '@entity_type.manager'
      - '@entity_field.manager'
      - '@language_manager'
      - '@plugin.manager.content_relay_field_normalizer'
      - '@plugin.manager.content_relay_normalizer'
      - '@plugin.manager.content_relay_transform'
      - '@content_relay.entity_serializer'
      - '@content_relay_replica.local_only_fields'

  content_relay_replica.mappings:
    class: Drupal\content_relay_replica\Mapping\MappingRepository
    arguments: ['@entity_type.manager']

  content_relay_replica.compatibility_checker:
    class: Drupal\content_relay_replica\Schema\CompatibilityChecker
    arguments: ['@content_relay.schema_describer', '@content_relay_replica.language_map']

  content_relay_replica.schema_watcher:
    class: Drupal\content_relay_replica\Schema\SchemaWatcher
    arguments:
      - '@content_relay_replica.origin_client'
      - '@content_relay_replica.contracts'
      - '@content_relay_replica.mappings'
      - '@content_relay_replica.compatibility_checker'
      - '@state'
      - '@datetime.time'
      - '@logger.channel.content_relay_replica'

  content_relay_replica.puller:
    class: Drupal\content_relay_replica\Puller
    arguments:
      - '@content_relay_replica.origin_client'
      - '@content_relay_replica.origin'
      - '@content_relay_replica.applier'

  content_relay_replica.conflicts:
    class: Drupal\content_relay_replica\Conflicts
    arguments:
      - '@content_relay_replica.sync_state'
      - '@content_relay_replica.local_changes'
      - '@content_relay_replica.local_only_fields'
      - '@content_relay_replica.origin_client'
      - '@content_relay_replica.puller'
      - '@content_relay_replica.detacher'
      - '@content_relay.entity_serializer'
      - '@content_relay_replica.mapped_importer'
      - '@entity_type.manager'
      - '@current_user'
      - '@datetime.time'
      - '@logger.channel.content_relay_replica'
      - '@content_relay_replica.language_map'

  content_relay_replica.reconciler:
    class: Drupal\content_relay_replica\Reconciler
    arguments:
      - '@database'
      - '@content_relay_replica.origin_client'
      - '@content_relay_replica.origin'
      - '@content_relay_replica.contracts'
      - '@content_relay_replica.sync_state'
      - '@content_relay_replica.applier'
      - '@content_relay_replica.puller'
      - '@content_relay_replica.stream'
      - '@entity.repository'
      - '@config.factory'
      - '@state'
      - '@current_user'
      - '@datetime.time'
      - '@uuid'
      - '@logger.channel.content_relay_replica'
      - '@queue'

  content_relay_replica.adopter:
    class: Drupal\content_relay_replica\Adopter
    arguments:
      - '@content_relay_replica.origin_client'
      - '@content_relay_replica.origin'
      - '@content_relay_replica.contracts'
      - '@content_relay_replica.sync_state'
      - '@content_relay_replica.local_changes'
      - '@content_relay_replica.mappings'
      - '@content_relay_replica.language_map'
      - '@entity.repository'
      - '@entity_type.manager'
      - '@content_relay_replica.failed_events'
      - '@content_relay_replica.applier'
      - '@datetime.time'
      - '@logger.channel.content_relay_replica'

  content_relay_replica.validator:
    class: Drupal\content_relay_replica\Validator
    arguments:
      - '@content_relay_replica.sync_state'
      - '@content_relay_replica.local_changes'
      - '@content_relay_replica.origin_client'

  content_relay_replica.language_map:
    class: Drupal\content_relay_replica\LanguageMap
    arguments: ['@config.factory', '@language_manager']

  content_relay_replica.language_subscription:
    class: Drupal\content_relay_replica\LanguageSubscription
    arguments:
      - '@database'
      - '@content_relay_replica.contracts'
      - '@content_relay_replica.sync_state'
      - '@content_relay_replica.local_changes'
      - '@content_relay_replica.language_map'
      - '@queue'
      - '@state'
      - '@config.factory'
      - '@datetime.time'
      - '@logger.channel.content_relay_replica'

  content_relay_replica.moderation:
    class: Drupal\content_relay_replica\Moderation
    arguments: ['@config.factory', '@?content_moderation.moderation_information']
